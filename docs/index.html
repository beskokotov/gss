алы, формы и образцы документов. Состав конкретного комплекта согласуется при подборе."],["Можно ли познакомиться с системой до подключения?","Свяжитесь с нами, чтобы согласовать демонстрацию. Подготовьте рабочий вопрос: так будет проще оценить поиск и нужные вам материалы. Условия ознакомительного доступа уточняются у менеджера."],["Сколько стоит подключение?","Стоимость зависит от наполнения и согласованных условий работы. Менеджер подготовит предложение после обсуждения ваших задач."],["Кто поможет после подключения?","Региональная команда оказывает техническую и методическую поддержку, помогает осваивать систему. Перечень и условия услуг уточняются для вашего комплекта."]];function jm({name:j="",contact:L="",message:V="",topic:g="Демонстрация системы ГАРАНТ"}){const K=`Здравствуйте!
