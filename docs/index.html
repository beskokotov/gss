нда решает каждый день.",paragraphs:["Определите, кто будет работать с системой: бухгалтерия, юристы, кадровая служба или руководитель. Составьте список тем, документов и рабочих ситуаций, которые встречаются чаще всего.","На демонстрации попросите показать поиск по вашим примерам. Обсудите нужные информационные блоки, формат доступа и состав сопровождения. Точное наполнение и стоимость подтвердит менеджер."]},{id:"demo",category:"Памятка",title:"Что посмотреть на демонстрации",icon:"search",intro:"Практический пример расскажет о системе больше, чем перечень функций.",paragraphs:["Подготовьте один типичный вопрос вашей организации и документ, с которым часто работаете. Попросите показать поиск, связанные материалы и доступные формы.","Уточните, как организовать работу нескольких сотрудников и куда обращаться за помощью. Согласуйте условия доступа и обучения до подключения."]},{id:"support",category:"Для пользователей",title:"Как подготовить обращение в поддержку",icon:"chat",intro:"Краткое описание задачи поможет специалисту разобраться в вопросе.",paragraphs:["Укажите, с каким разделом или документом вы работаете и какой результат хотите получить. Для технического вопроса опишите последовательность действий и текст ошибки.","Для связи с региональной командой используйте телефоны и электронную почту в разделе «Контакты». Не включайте в первое письмо лишние персональные или конфиденциальные данные."]}],Em=[["Что входит в систему ГАРАНТ?","В зависимости от выбранного наполнения — нормативные акты, судебная практика, экспертные материалы, формы и образцы документов. Состав конкретного комплекта согласуется при подборе."],["Можно ли познакомиться с системой до подключения?","Свяжитесь с нами, чтобы согласовать демонстрацию. Подготовьте рабочий вопрос: так будет проще оценить поиск и нужные вам материалы. Условия ознакомительного доступа уточняются у менеджера."],["Сколько стоит подключение?","Стоимость зависит от наполнения и согласованных условий работы. Менеджер подго
