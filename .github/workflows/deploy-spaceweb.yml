name: Deploy gss.ru

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Publish a new static release or restore the previous one'
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      baseline_manifest:
        description: 'Optional compact JSON from a previous release-manifest.json'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: gss-spaceweb-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare static SpaceWeb release
    if: github.repository == 'beskokotov/gss' && github.ref == 'refs/heads/main' && inputs.mode == 'deploy'
    runs-on: ubuntu-24.04
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies for build and tests
        run: |
          npm ci
          composer --working-dir=server install --no-dev --prefer-dist --no-interaction --no-progress --no-scripts --no-plugins

      - name: Check source and run tests
        run: |
          git diff --check
          npm test
          php -l server/public/news.php
          php -l server/news/cache.php
          php -l server/news/update.php
          php scripts/check-news.php
          php scripts/check-spaceweb-release.php
          npm run test:server

      - name: Build and check the hosting package
        run: |
          npm run build:hosting
          npm run check:hosting
          npm run check:preview

      - name: Stage static files and compare release manifests
        env:
          BASELINE_MANIFEST: ${{ inputs.baseline_manifest }}
        run: |
          baseline=()
          if [[ -n "$BASELINE_MANIFEST" ]]; then
            baseline=("$RUNNER_TEMP/spaceweb-baseline.json")
            printf '%s\n' "$BASELINE_MANIFEST" > "${baseline[0]}"
          fi
          node scripts/prepare-spaceweb-release.mjs "$RUNNER_TEMP/gss-spaceweb-release" "${baseline[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the static release for review
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gss-spaceweb-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gss-spaceweb-release/
          if-no-files-found: error

  publish:
    name: Apply static SpaceWeb release
    needs: prepare
    if: >-
      !cancelled() && github.repository == 'beskokotov/gss' && github.ref == 'refs/heads/main' &&
      ((inputs.mode == 'deploy' && needs.prepare.result == 'success') ||
       (inputs.mode == 'rollback' && needs.prepare.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: spaceweb-production
    steps:
      - name: Check out the release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the verified artifact for this run
        if: inputs.mode == 'deploy'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/gss-spaceweb-artifact
          merge-multiple: true

      - name: Validate and prepare the SSH payload
        env:
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          umask 077
          release_id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          php -r 'require "scripts/spaceweb-release.php"; Gss\SpaceWeb\pack($argv[1], $argv[2], $argv[3], $argv[4]);' \
            "$RELEASE_MODE" "$release_id" "$GITHUB_SHA" "$RUNNER_TEMP/gss-spaceweb-artifact" > "$RUNNER_TEMP/spaceweb-release.php"
          php -r 'require "scripts/spaceweb-release.php"; Gss\SpaceWeb\pack($argv[1], $argv[2], $argv[3], "");' \
            recover "$release_id" "$GITHUB_SHA" > "$RUNNER_TEMP/spaceweb-recovery.php"

      - name: Verify and pin the SpaceWeb host key
        env:
          SPACEWEB_HOST_KEY: ${{ vars.SPACEWEB_SSH_HOST_KEY }}
        run: |
          if [[ ! "$SPACEWEB_HOST_KEY" =~ ^ssh-ed25519\ [A-Za-z0-9+/]+={0,2}$ ]]; then
            echo 'Set SPACEWEB_SSH_HOST_KEY to ssh-ed25519 followed by the base64 public key.'
            exit 1
          fi
          umask 077
          public_key="$RUNNER_TEMP/spaceweb-host.pub"
          printf '%s\n' "$SPACEWEB_HOST_KEY" > "$public_key"
          fingerprint=$(ssh-keygen -E sha256 -lf "$public_key" | awk '{print $2}')
          if [[ "$fingerprint" != 'SHA256:fDATcu43/zhAoS18DoD79nQjgUy1/Qmfq07t5VrDAew' ]]; then
            echo 'SpaceWeb host key fingerprint mismatch.'
            exit 1
          fi
          printf '%s %s\n' '77.222.40.35' "$SPACEWEB_HOST_KEY" > "$RUNNER_TEMP/spaceweb-known-hosts"

      - name: Apply the release over SSH
        env:
          SPACEWEB_SSH_PRIVATE_KEY: ${{ secrets.SPACEWEB_SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPACEWEB_SSH_PRIVATE_KEY" ]]; then
            echo 'The SPACEWEB_SSH_PRIVATE_KEY secret is missing.'
            exit 1
          fi
          umask 077
          identity=$(mktemp "$RUNNER_TEMP/spaceweb-identity.XXXXXX")
          trap 'rm -f -- "$identity"' EXIT
          printf '%s\n' "${SPACEWEB_SSH_PRIVATE_KEY//$'\r'/}" > "$identity"
          unset SPACEWEB_SSH_PRIVATE_KEY

          connect() {
            timeout --kill-after=5s "$1" ssh -F /dev/null -T -p 22 -i "$identity" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$RUNNER_TEMP/spaceweb-known-hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o HostKeyAlgorithms=ssh-ed25519 \
              -o UpdateHostKeys=no \
              -o IdentitiesOnly=yes \
              -o IdentityAgent=none \
              -o PreferredAuthentications=publickey \
              -o ClearAllForwardings=yes \
              -o ConnectTimeout=10 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              bdvgssru@77.222.40.35 /usr/bin/php8.4 < "$2"
          }
          if connect 240s "$RUNNER_TEMP/spaceweb-release.php"; then
            exit 0
          else
            result=$?
          fi
          echo 'Release failed; checking for an interrupted transaction.'
          if ! connect 60s "$RUNNER_TEMP/spaceweb-recovery.php"; then
            echo 'Recovery could not be confirmed. The next release invocation will retry it under the lock.'
          fi
          exit "$result"
