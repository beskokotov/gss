name: Build and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Read the RSS feed
        id: news
        continue-on-error: true
        run: npm run rss:update

      - name: Keep the saved news if the feed is unavailable
        if: steps.news.outcome == 'failure'
        run: echo '::warning::RSS is unavailable; publishing with the saved news snapshot.'

      - name: Test the site
        run: npm test

      - name: Build the Pages site
        run: npm run build:pages

      - name: Check the standalone preview
        run: npm run check:preview

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
